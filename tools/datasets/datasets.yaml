# AksaraScan v3.0 — Registri Sumber Dataset & Korpus Resmi (Fase 1)
# Status:
#   OK               -> Lisensi terverifikasi & dapat diunduh otomatis tanpa login
#   PERLU_LOGIN      -> Membutuhkan API key / login akun (lihat tools/datasets/MANUAL.md)
#   PERLU_KONFIRMASI -> Lisensi tidak jelas / perlu verifikasi ketentuan koleksinya

sources:
  - id: hanacaraka_vzrenggamani
    name: "Aksara Jawa / Hanacaraka (Digital Handwriting)"
    author: "R. P. Nugroho (vzrenggamani) & kontributor"
    url: "https://github.com/vzrenggamani/aksarajawa-hanacaraka"
    task: "glyph_classification_20_nglegena"
    format: "imagefolder_png"
    license: "CC0-1.0"
    license_verified: true
    size: "1,579 gambar (~9.2 MB)"
    status: "OK"
    local_dir: "dataset/hanacaraka"
    method: "local_repo"

  - id: mendeley_indonesian_scripts_jawa
    name: "Indonesian Local Script Characters (Subset Jawa / Jawa.zip)"
    author: "Aditya Firman Ihsan (Telkom University)"
    url: "https://doi.org/10.17632/vfj32bpjsf.1"
    task: "glyph_handwriting_nglegena_sandhangan_variants"
    format: "zip_imagefolder"
    license: "CC BY 4.0"
    license_verified: true
    size: "13,256 gambar (135.3 MB)"
    status: "OK"
    local_dir: "dataset/external/jawa_mendeley"
    local_mirror_candidates:
      - "../Projek_Akhir/dataset/Jawa.zip"
      - "dataset/indonesian-scripts/Jawa.zip"
    method: "local_zip_or_manual"

  - id: hf_setilanaji_aksara_jawa_ocr
    name: "Aksara Jawa OCR Multi-Line Dataset"
    author: "setilanaji (Hugging Face)"
    url: "https://huggingface.co/datasets/setilanaji/aksara-jawa-ocr"
    task: "line_ocr_transcription_and_detection"
    format: "ppocrlabel_jpg_jsonl"
    license: "Apache-2.0"
    license_verified: true
    size: "1,158 berkas (~1,000 train + 150 eval)"
    status: "OK"
    local_dir: "dataset/external/setilanaji_aksara_jawa_ocr"
    hf_repo: "setilanaji/aksara-jawa-ocr"
    method: "hf_snapshot"

  - id: noto_sans_javanese_ofl
    name: "Noto Sans Javanese Font"
    author: "The Noto Project Authors (Google)"
    url: "https://github.com/notofonts/javanese"
    task: "synthetic_rendering_font"
    format: "ttf_opentype"
    license: "SIL OFL 1.1"
    license_verified: true
    size: "~253 KB"
    status: "OK"
    local_dir: "dataset/external/fonts"
    local_mirror_candidates:
      - "../Projek_Akhir/fonts/NotoSansJavanese.ttf"
    urls:
      - "https://raw.githubusercontent.com/notofonts/javanese/main/fonts/NotoSansJavanese/unhinted/ttf/NotoSansJavanese-Regular.ttf"
    method: "http_or_mirror"

  - id: tuladha_jejeg_ot_ofl
    name: "Tuladha Jejeg OT Font"
    author: "R.S. Wihananto & Fadhl Haqq (akufadhl)"
    url: "https://github.com/akufadhl/Tuladha-Jejeg-OT"
    task: "synthetic_rendering_font"
    format: "ttf_otf_opentype"
    license: "SIL OFL 1.1"
    license_verified: true
    size: "~121 KB"
    status: "OK"
    local_dir: "dataset/external/fonts"
    local_mirror_candidates:
      - "../Projek_Akhir/fonts/TuladhaJejegOT-Regular.ttf"
      - "../Projek_Akhir/fonts/TuladhaJejegOT-Regular.otf"
    urls:
      - "https://raw.githubusercontent.com/akufadhl/Tuladha-Jejeg-OT/main/OFL.txt"
    method: "http_or_mirror"

  - id: nusax_mt_lexicon
    name: "NusaX Parallel Corpus & Bilingual Javanese Lexicon"
    author: "IndoNLP"
    url: "https://github.com/IndoNLP/nusax"
    task: "corpus_lexicon_and_translation"
    format: "csv"
    license: "CC-BY-SA-4.0 (data) / Apache-2.0 (code)"
    license_verified: true
    size: "~1 MB"
    status: "OK"
    local_dir: "dataset/external/nusax"
    urls:
      - "https://raw.githubusercontent.com/IndoNLP/nusax/main/datasets/lexicon/javanese.csv"
      - "https://raw.githubusercontent.com/IndoNLP/nusax/main/datasets/mt/train.csv"
      - "https://raw.githubusercontent.com/IndoNLP/nusax/main/datasets/mt/valid.csv"
      - "https://raw.githubusercontent.com/IndoNLP/nusax/main/datasets/mt/test.csv"
    method: "http_files"

  - id: nusawrites_jav
    name: "NusaWrites (NusaTranslation & NusaParagraph Javanese)"
    author: "IndoNLP"
    url: "https://github.com/IndoNLP/nusa-writes"
    task: "corpus_language_model_and_translation"
    format: "csv"
    license: "Apache-2.0"
    license_verified: true
    size: "~8 MB"
    status: "OK"
    local_dir: "dataset/external/nusa_writes"
