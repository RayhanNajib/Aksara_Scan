      - "https://raw.githubusercontent.com/IndoNLP/nusa-writes/main/data/nusa_kalimat-mt-jav-valid.csv"
      - "https://raw.githubusercontent.com/IndoNLP/nusa-writes/main/data/nusa_kalimat-mt-jav-test.csv"
      - "https://raw.githubusercontent.com/IndoNLP/nusa-writes/main/data/nusa_alinea-paragraph-jav-train.csv"
      - "https://raw.githubusercontent.com/IndoNLP/nusa-writes/main/data/nusa_alinea-paragraph-jav-valid.csv"
      - "https://raw.githubusercontent.com/IndoNLP/nusa-writes/main/data/nusa_alinea-paragraph-jav-test.csv"
    method: "http_files"

  - id: sastra_jawa_csv
    name: "Sastra Jawa CSV Dictionary & Dasanama"
